name: DevSecOps Security Scan & Audit

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  security-audit:
    name: Layer 1 & Layer 2 Security Audit (Secrets, Deps, ShellCheck)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner (Layer 1 - Primary)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TruffleHog Secret Scanner (Layer 1 - Secondary)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Frontend ESLint Security & Quality Check (Layer 1)
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          npm ci --silent
          npm run lint --if-present

      - name: Frontend npm Audit (Layer 2 - Production Hard Gate & Dev Report)
        if: hashFiles('frontend/package-lock.json') != ''
        working-directory: frontend
        run: |
          echo "=== Production Dependencies Hard Gate (--omit=dev) ==="
          npm audit --omit=dev --audit-level=high
          echo "=== Verified Overridden Package Version ==="
          npm list picomatch || true
          echo "=== Full Tree Advisory Report (Non-blocking for overridden devDependencies) ==="
          npm audit --audit-level=high || true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache-dependency-path: '**/go.sum'

      - name: Backend Go Vulnerability Check (Layer 2 - govulncheck)
        if: hashFiles('backend/go.mod') != ''
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Snyk Deep Dependency & Zero-Day Scan (Layer 2 - Optional Token)
        if: hashFiles('frontend/package.json') != ''
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            npx --yes snyk test --file=frontend/package.json --severity-threshold=high
          else
            echo "SNYK_TOKEN tanımlı değil; Snyk adımı atlandı (npm audit & govulncheck aktif)."
          fi

      - name: ShellCheck & Bash Syntax Audit (DR Scripts)
        run: |
          bash -n scripts/*.sh
          shellcheck scripts/*.sh

  backend-smoke:
    name: Runtime - Backend Security Smoke (local API)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
          cache-dependency-path: '**/go.sum'

      # Sadece lokal (loopback) ornek test edilir: rate limit, CORS ve govde
      # limitleri negatif trafik gerektirir; production'a gonderilmez.
      - name: Run Backend Security Smoke Suite
        env:
          SECOPS_SMOKE_AUTOSTART: '1'
        run: bash scripts/security-smoke.sh

  terraform-security:
    name: Layer 3 - IaC Security & Always Free Guard
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Trivy, tfsec'in halefidir: ayni kural motoru artik yalnizca Trivy
      # uzerinden guncelleniyor. Terraform koku repository kokunde oldugu icin
      # scan-ref '.' olarak verilir, gurultu yapan dizinler atlanir.
      - name: Run Trivy IaC Scan (tfsec successor)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          skip-dirs: '.terraform,frontend/node_modules,frontend/dist,backend,policies/testdata'

      # Bagimsiz ikinci motor: Trivy'nin kacirdigi konfigurasyonlari yakalar.
      - name: Run KICS IaC Scan (independent cross-check)
        uses: checkmarx/kics-github-action@v2.2.1
        with:
          path: '.'
          platform_type: 'Terraform'
          fail_on: 'high,critical'
          exclude_paths: '**/.terraform/**,**/node_modules/**,**/dist/**,**/policies/testdata/**'

      # OCI Always Free sinirlari Trivy/KICS kurallarinda yer almaz; bu yuzden
      # planlanan kaynaklari OPA/Rego ile ayrica dogruluyoruz. Conftest HCL'i
      # dogrudan ayristirdigi icin OCI kimlik bilgisi veya plan ciktisi gerekmez.
      - name: Install Conftest (OPA)
        env:
          CONFTEST_VERSION: '0.71.1'
        run: |
          curl -sSfL -o conftest.tar.gz \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          tar -xzf conftest.tar.gz conftest
          sudo install -m 0755 conftest /usr/local/bin/conftest
          conftest --version

      - name: Enforce OCI Always Free Policy Gate (OPA/Rego)
        run: |
          conftest test --no-color --combine --parser hcl2 --policy policies \
            $(find . -maxdepth 1 -name '*.tf' -print)

      # Politika sessizce "her seyi gecti" durumuna dusmesin diye negatif
      # fixture uzerinde FAIL uretmesi zorunlu tutulur.
      - name: Self-test Always Free Policy Gate (must detect violations)
        env:
          NO_COLOR: '1'
        run: |
          set +e
          output=$(conftest test --no-color --combine --parser hcl2 --policy policies policies/testdata/bad 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ] || ! printf '%s\n' "$output" | grep -q 'FAIL'; then
            echo "::error::Always Free policy self-test failed: fixture violations in policies/testdata/bad were not reported."
            exit 1
          fi
          echo "Policy self-test passed: fixture violations were rejected."
