name: DevSecOps Security Scan & Audit

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  security-audit:
    name: Layer 1 & IaC Security Audit (Gitleaks, TruffleHog, tfsec, ShellCheck)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner (Layer 1 - Primary)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TruffleHog Secret Scanner (Layer 1 - Secondary)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Frontend ESLint Security & Quality Check
        if: hashFiles('frontend/package.json') != ''
        working-directory: frontend
        run: |
          npm ci --silent
          npm run lint --if-present

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Run tfsec Security Scanner
        uses: aquasecurity/tfsec-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          soft_fail: false

      - name: ShellCheck & Bash Syntax Audit (DR Scripts)
        run: |
          bash -n scripts/*.sh
          shellcheck scripts/*.sh
