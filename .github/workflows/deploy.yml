name: Enterprise DevOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-validate-and-security:
    name: Terraform Validate & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init (Backendless for validation)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Run Checkov Security Scanner
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform
          output_format: cli
          soft_fail: true

  deploy-static-content:
    name: Deploy Static Web Content
    needs: terraform-validate-and-security
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to OCI Instance via Object Storage / Pull Mechanism or SSH
        run: |
          echo "Static website content ready for deployment."
          # İlerleyen aşamada OCI Object Storage veya Bastion/SSH üzerinden rsync ile index.html güncellenebilir.
          echo "To update production Nginx, place index.html sync script here."
