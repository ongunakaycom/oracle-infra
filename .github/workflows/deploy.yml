name: Deploy to Oracle Cloud

on:
  push:
    branches: [ "main", "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo mkdir -p /var/www/html
            echo "<!DOCTYPE html>
            <html lang='tr'>
            <head><meta charset='UTF-8'><title>Oracle Cloud DevOps</title></head>
            <body style='font-family:sans-serif; text-align:center; padding-top:50vh;'>
              <h1>Oracle Cloud DevOps & CI/CD Success!</h1>
              <p>Otomatik deployment başarıyla gerçekleşti.</p>
            </body>
            </html>" | sudo tee /var/www/html/index.html > /dev/null
            sudo chown -R $USER:$USER /var/www/html
            if ! command -v nginx &> /dev/null; then
                sudo dnf install -y nginx || sudo apt update && sudo apt install -y nginx
            fi
            sudo systemctl enable nginx
            sudo systemctl restart nginx
