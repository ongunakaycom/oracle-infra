name: Enterprise DevOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-validate-and-security:
    name: Terraform Validate & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init (Backendless for validation)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Run Checkov Security Scanner
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform
          output_format: cli
          soft_fail: true

  deploy-static-content:
    name: Build & Deploy React Frontend & Go API
    needs: terraform-validate-and-security
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies & Build Vite App
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Test Go SecOps API
        working-directory: ./backend
        run: |
          go get modernc.org/sqlite@v1.28.0
          go vet ./...
          go test -v -race ./...

      - name: Build Go SecOps API Binary
        working-directory: ./backend
        run: |
          go get modernc.org/sqlite@v1.28.0
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o secops-api main.go

      - name: Deploy Artifacts to OCI Instance
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ vars.REMOTE_HOST }}
          REMOTE_USER: "opc"
          SECOPS_ADMIN_USER: ${{ secrets.SECOPS_ADMIN_USER }}
          SECOPS_ADMIN_PASS: ${{ secrets.SECOPS_ADMIN_PASS }}
          SECOPS_JWT_SECRET: ${{ secrets.SECOPS_JWT_SECRET }}
        run: |
          if [ -z "$REMOTE_HOST" ]; then
            echo "::error::Repository variable REMOTE_HOST is not set"
            exit 1
          fi
          if [ -z "$SECOPS_ADMIN_USER" ] || [ -z "$SECOPS_ADMIN_PASS" ] || [ -z "$SECOPS_JWT_SECRET" ]; then
            echo "::error::SECOPS_ADMIN_USER, SECOPS_ADMIN_PASS and SECOPS_JWT_SECRET repository secrets must be set"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$REMOTE_HOST" >> ~/.ssh/known_hosts

          # Sunucu hedef klasörlerini hazırla
          ssh -i ~/.ssh/deploy_key "$REMOTE_USER@$REMOTE_HOST" "sudo mkdir -p /usr/share/nginx/html /home/opc/secops-api /opt/secops /etc/secops && sudo chown -R $REMOTE_USER:$REMOTE_USER /usr/share/nginx/html /home/opc/secops-api /opt/secops"

          # Vite dist/ çıktısını senkronize et
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" frontend/dist/ "$REMOTE_USER@$REMOTE_HOST:/usr/share/nginx/html/"

          # Go binary, systemd unit ve Caddy edge yapılandırmasını sunucuya kopyala
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" backend/secops-api backend/secops-api.service backend/Caddyfile "$REMOTE_USER@$REMOTE_HOST:/home/opc/secops-api/"

          # Ortam dosyasını yalnızca repository secret'larından üret (600, root)
          ENV_PAYLOAD=$(printf 'SECOPS_ADMIN_USER=%s\nSECOPS_ADMIN_PASS=%s\nSECOPS_JWT_SECRET=%s\n' \
            "$SECOPS_ADMIN_USER" "$SECOPS_ADMIN_PASS" "$SECOPS_JWT_SECRET" | base64 -w0)
          printf '%s' "$ENV_PAYLOAD" | ssh -i ~/.ssh/deploy_key "$REMOTE_USER@$REMOTE_HOST" \
            "umask 077 && sudo install -d -m 0700 -o root -g root /etc/secops && base64 -d | sudo tee /etc/secops/secops.env >/dev/null && sudo chown root:root /etc/secops/secops.env && sudo chmod 600 /etc/secops/secops.env"

          # Binary'yi SELinux'un systemd için izin verdiği /opt/secops altına kur, servisi başlat ve doğrula
          ssh -i ~/.ssh/deploy_key "$REMOTE_USER@$REMOTE_HOST" bash -s <<'REMOTE'
          set -euo pipefail

          # Eski konumdaki SQLite veritabanını koru
          if [ -f /home/opc/secops-api/secops.db ] && [ ! -f /opt/secops/secops.db ]; then
            sudo mv /home/opc/secops-api/secops.db /opt/secops/secops.db
          fi

          sudo install -o opc -g opc -m 0755 /home/opc/secops-api/secops-api /opt/secops/secops-api
          sudo install -o root -g root -m 0644 /home/opc/secops-api/secops-api.service /etc/systemd/system/secops-api.service

          # Caddy: yeni yapılandırmayı doğrula, yedekle ve ancak başarılıysa devreye al
          if command -v caddy >/dev/null 2>&1 && [ -d /etc/caddy ]; then
            sudo install -o root -g root -m 0644 /home/opc/secops-api/Caddyfile /etc/caddy/Caddyfile.next
            if sudo caddy validate --config /etc/caddy/Caddyfile.next --adapter caddyfile; then
              if [ -f /etc/caddy/Caddyfile ]; then
                sudo cp -a /etc/caddy/Caddyfile /etc/caddy/Caddyfile.bak
              fi
              sudo mv /etc/caddy/Caddyfile.next /etc/caddy/Caddyfile
              sudo systemctl reload caddy 2>/dev/null || sudo systemctl restart caddy
            else
              sudo rm -f /etc/caddy/Caddyfile.next
              echo "::error::Caddyfile validation failed; keeping the previous configuration"
              exit 1
            fi
          else
            echo "::warning::Caddy is not installed on the target; skipping edge configuration"
          fi

          sudo restorecon -Rv /opt/secops /usr/share/nginx/html >/dev/null 2>&1 || true

          sudo systemctl daemon-reload
          sudo systemctl enable secops-api >/dev/null 2>&1 || true
          sudo systemctl restart secops-api

          sleep 3
          echo "--- systemctl status ---"
          sudo systemctl status secops-api --no-pager -l | head -40 || true
          echo "--- recent journal ---"
          sudo journalctl -u secops-api -n 60 --no-pager || true
          echo "--- health probe ---"
          if command -v curl >/dev/null 2>&1 && curl -fsS -m 5 http://127.0.0.1:8080/api/health; then
            echo
            echo "Deployment health check passed"
          elif timeout 3 bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' 2>/dev/null; then
            echo "Port 8080 is listening (curl not available for HTTP probe)"
          else
            echo "::error::secops-api is not responding on 127.0.0.1:8080"
            exit 1
          fi
          REMOTE