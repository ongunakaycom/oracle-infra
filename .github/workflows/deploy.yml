name: Enterprise DevOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform-validate-and-security:
    name: Terraform Validate & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init (Backendless for validation)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Run Checkov Security Scanner
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform
          output_format: cli
          soft_fail: true

  deploy-static-content:
    name: Build & Deploy React Frontend & Go API
    needs: terraform-validate-and-security
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies & Build Vite App
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Go SecOps API Binary
        working-directory: ./backend
        run: |
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o secops-api main.go

      - name: Deploy Artifacts to OCI Instance
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ vars.REMOTE_HOST }}
          REMOTE_USER: "opc"
        run: |
          if [ -z "$REMOTE_HOST" ]; then
            echo "::error::Repository variable REMOTE_HOST is not set"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$REMOTE_HOST" >> ~/.ssh/known_hosts

          # Sunucu hedef klasörlerini hazırla
          ssh -i ~/.ssh/deploy_key "$REMOTE_USER@$REMOTE_HOST" "sudo mkdir -p /usr/share/nginx/html /home/opc/secops-api && sudo chown -R $REMOTE_USER:$REMOTE_USER /usr/share/nginx/html /home/opc/secops-api"

          # Vite dist/ çıktısını senkronize et
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" frontend/dist/ "$REMOTE_USER@$REMOTE_HOST:/usr/share/nginx/html/"

          # Go binary'yi sunucuya kopyala
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" backend/secops-api "$REMOTE_USER@$REMOTE_HOST:/home/opc/secops-api/"

          # Systemd servisini kur ve yeniden başlat
          ssh -i ~/.ssh/deploy_key "$REMOTE_USER@$REMOTE_HOST" "sudo cp /home/opc/secops-api/secops-api.service /etc/systemd/system/secops-api.service 2>/dev/null || true"
          
          # Eğer repo kökünden service dosyası kopyalanacaksa:
          # (Alternatif olarak backend/ içindeki service dosyasını da gönderelim)
          scp -i ~/.ssh/deploy_key backend/secops-api.service "$REMOTE_USER@$REMOTE_HOST:/tmp/secops-api.service"
          ssh -i ~/.ssh/deploy_key "$REMOTE_USER@$REMOTE_HOST" "sudo mv /tmp/secops-api.service /etc/systemd/system/secops-api.service && sudo systemctl daemon-reload && sudo systemctl enable secops-api && sudo systemctl restart secops-api"

          # Oracle Linux SELinux dosya bağlamını yenile
          ssh -i ~/.ssh/deploy_key "$REMOTE_USER@$REMOTE_HOST" "sudo restorecon -Rv /usr/share/nginx/html"